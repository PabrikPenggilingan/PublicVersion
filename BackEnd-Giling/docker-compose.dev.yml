version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gabah_postgres_dev
    environment:
      POSTGRES_USER: gabah_user
      POSTGRES_PASSWORD: gabah_password
      POSTGRES_DB: gabah_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - gabah_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gabah_user"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  gabah_network:
    driver: bridge

volumes:
  postgres_data_dev:
