name: Deploy Backend to GCP Cloud Run

on:
  push:
    branches:
      - AkmalDeploy
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'

env:
  PROJECT_ID: ${{ secrets.PADINADIPILOT2026 }}
  REGION: asia-southeast1
  GAR_REPOSITORY: padinadipilot

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Environment Target
        id: env-target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "ENV_NAME=production" >> $GITHUB_OUTPUT
            echo "SERVICE_NAME=gabah-api" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=latest" >> $GITHUB_OUTPUT
            echo "SECRETS=DATABASE_URL=DATABASE_URL:latest,LOG_DATABASE_URL=LOG_DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,CORS_ORIGIN=CORS_ORIGIN:latest" >> $GITHUB_OUTPUT
          else
            echo "ENV_NAME=staging" >> $GITHUB_OUTPUT
            echo "SERVICE_NAME=gabah-api-staging" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=staging" >> $GITHUB_OUTPUT
            echo "SECRETS=DATABASE_URL=DATABASE_URL_STAGING:latest,LOG_DATABASE_URL=LOG_DATABASE_URL_STAGING:latest,JWT_SECRET=JWT_SECRET_STAGING:latest,CORS_ORIGIN=CORS_ORIGIN_STAGING:latest" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.A0BD24361DB397E92284217DC5D7351CD741343BE }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Docker Image
        run: |
          cd backend
          IMAGE_FULL="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/gabah-api:${{ steps.env-target.outputs.IMAGE_TAG }}"
          IMAGE_SHA="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/gabah-api:${{ github.sha }}"
          
          docker build -t "$IMAGE_FULL" -t "$IMAGE_SHA" .
          docker push "$IMAGE_FULL"
          docker push "$IMAGE_SHA"

      - name: Deploy to Cloud Run
        run: |
          IMAGE_SHA="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/gabah-api:${{ github.sha }}"
          
          gcloud run deploy ${{ steps.env-target.outputs.SERVICE_NAME }} \
            --image="$IMAGE_SHA" \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=3000 \
            --memory=512Mi \
            --cpu=1 \
            --set-secrets="${{ steps.env-target.outputs.SECRETS }}"
# Trigger production deploy
