# NGINX config for serving React SPA on GCP Cloud Run
server {
    listen 80;
    server_name _;

    # Allow file uploads up to 25MB
    client_max_body_size 25M;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss;

    # Proxy API requests to Cloud Run Backend
    location /api/ {
        proxy_pass https://gabah-api-615541393276.asia-southeast1.run.app;
        proxy_http_version 1.1;
        proxy_set_header Host gabah-api-615541393276.asia-southeast1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
    }
    # Uploaded photos (bukti struk, lapangan, sesi jemur/giling) live on the backend.
    # ^~ makes this win over the static-asset regex below (.png/.jpg would 404 here).
    location ^~ /uploads/ {
        proxy_pass https://gabah-api-615541393276.asia-southeast1.run.app;
        proxy_http_version 1.1;
        proxy_set_header Host gabah-api-615541393276.asia-southeast1.run.app;
        proxy_ssl_server_name on;
    }


    # Proxy Health check
    location /health {
        proxy_pass https://gabah-api-615541393276.asia-southeast1.run.app/health;
        proxy_http_version 1.1;
        proxy_set_header Host gabah-api-615541393276.asia-southeast1.run.app;
        proxy_ssl_server_name on;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it points to the hashed JS/CSS of the current
    # deploy. Without this, phones (and home-screen web apps) keep loading the old
    # bundle after a deploy while desktop shows the new one.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # SPA fallback: all routes serve index.html so React Router works
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
